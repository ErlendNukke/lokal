services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lokal
      POSTGRES_USER: lokal
      POSTGRES_PASSWORD: lokal
    ports:
      - "5432:5432"
    volumes:
      - kk_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lokal
      MINIO_ROOT_PASSWORD: lokalsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kk_minio:/data

  api:
    build: ./backend
    profiles: ["full"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/lokal
      DATABASE_USER: lokal
      DATABASE_PASSWORD: lokal
      JWT_SECRET: change-me-in-production-use-long-secret
      CORS_ORIGINS: http://localhost:4200,http://localhost:8100
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  kk_pg:
  kk_minio:
