services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lokal
      POSTGRES_USER: lokal
      POSTGRES_PASSWORD: lokal
    ports:
      - "5432:5432"
    volumes:
      - kk_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lokal
      MINIO_ROOT_PASSWORD: lokalsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kk_minio:/data

  # Creates the public "lokal" bucket once MinIO is up
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lokal lokalsecret; do sleep 1; done;
      mc mb --ignore-existing local/lokal;
      mc anonymous set download local/lokal;
      echo 'MinIO bucket lokal is ready';
      "

  api:
    build: ./backend
    profiles: ["full"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/lokal
      DATABASE_USER: lokal
      DATABASE_PASSWORD: lokal
      JWT_SECRET: change-me-in-production-use-long-secret
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lokal
      S3_ACCESS_KEY: lokal
      S3_SECRET_KEY: lokalsecret
      S3_PUBLIC_BASE_URL: http://localhost:9000/lokal
      S3_PATH_STYLE: "true"
      S3_PUBLIC_READ: "true"
      S3_CREATE_BUCKET: "true"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - minio
      - minio-init

volumes:
  kk_pg:
  kk_minio:
