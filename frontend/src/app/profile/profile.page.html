<ion-header>
  <ion-toolbar>
    <ion-title>Profiil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="kk-page" *ngIf="auth.user as user">
    <div class="kk-hero-brand">
      <h1 class="logo">{{ user.name }}</h1>
      <p class="tagline">{{ user.email }} · {{ user.role }}</p>
    </div>

    <div class="kk-form">
      <ion-item>
        <ion-label position="stacked">Nimi</ion-label>
        <ion-input [(ngModel)]="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Linn</ion-label>
        <ion-input [(ngModel)]="city"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Roll</ion-label>
        <ion-select [(ngModel)]="role" interface="popover">
          <ion-select-option value="BUYER">Ostja</ion-select-option>
          <ion-select-option value="PRODUCER">Tootja</ion-select-option>
          <ion-select-option value="BOTH">Mõlemad</ion-select-option>
        </ion-select>
      </ion-item>

      <ng-container *ngIf="role === 'PRODUCER' || role === 'BOTH'">
        <ion-item>
          <ion-label position="stacked">Talu / brändi nimi</ion-label>
          <ion-input [(ngModel)]="farmName"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Kirjeldus</ion-label>
          <ion-textarea [(ngModel)]="farmDescription" rows="3"></ion-textarea>
        </ion-item>
        <ion-item>
          <ion-label>Järeletulemine</ion-label>
          <ion-toggle [(ngModel)]="pickupAvailable" slot="end"></ion-toggle>
        </ion-item>
        <ion-item>
          <ion-label>Kohaletoimetamine</ion-label>
          <ion-toggle [(ngModel)]="deliveryAvailable" slot="end"></ion-toggle>
        </ion-item>
      </ng-container>

      <ion-button expand="block" (click)="save()" [disabled]="saving">Salvesta</ion-button>
      <ion-button expand="block" fill="outline" color="medium" (click)="logout()">Logi välja</ion-button>
    </div>
  </div>
</ion-content>
