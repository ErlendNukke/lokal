<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/browse" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ mode === 'login' ? 'Logi sisse' : 'Loo konto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="kk-page auth">
    <div class="kk-hero-brand">
      <h1 class="logo">Kodukraam</h1>
      <p class="tagline">Otse tegijalt. Otse koju.</p>
    </div>

    <div class="kk-chip-row">
      <button type="button" class="kk-chip" [class.active]="mode==='login'" (click)="mode='login'">Sisselogimine</button>
      <button type="button" class="kk-chip" [class.active]="mode==='register'" (click)="mode='register'">Registreeru</button>
    </div>

    <div class="kk-form">
      <ion-item *ngIf="mode==='register'">
        <ion-label position="stacked">Nimi</ion-label>
        <ion-input [(ngModel)]="name" autocomplete="name"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">E-post</ion-label>
        <ion-input type="email" [(ngModel)]="email" autocomplete="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Parool</ion-label>
        <ion-input type="password" [(ngModel)]="password" autocomplete="current-password"></ion-input>
      </ion-item>

      <ion-item *ngIf="mode==='register'">
        <ion-label position="stacked">Roll</ion-label>
        <ion-select [(ngModel)]="role" interface="popover">
          <ion-select-option value="BUYER">Ostja</ion-select-option>
          <ion-select-option value="PRODUCER">Tootja</ion-select-option>
          <ion-select-option value="BOTH">Mõlemad</ion-select-option>
        </ion-select>
      </ion-item>

      <p class="error" *ngIf="error">{{ error }}</p>

      <ion-button expand="block" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Palun oota…' : (mode === 'login' ? 'Logi sisse' : 'Loo konto') }}
      </ion-button>

      <button mat-stroked-button type="button" class="google-btn" (click)="googleDemo()" [disabled]="loading">
        Jätka Google'iga (demo)
      </button>
    </div>

    <div class="demo-box">
      <p class="kk-muted">Demo kontod (parool: <code>password123</code>)</p>
      <button type="button" class="kk-chip" (click)="fillDemo('anna@kodukraam.ee')">Ostja · Anna</button>
      <button type="button" class="kk-chip" (click)="fillDemo('mari@kodukraam.ee')">Tootja · Mari</button>
      <button type="button" class="kk-chip" (click)="fillDemo('juri@kodukraam.ee')">Tootja · Jüri</button>
    </div>
  </div>
</ion-content>
