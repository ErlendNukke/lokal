services:
  - type: web
    name: lokal-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Image storage: set STORAGE_TYPE=s3 and fill S3_* (Cloudflare R2 / AWS S3 / MinIO).
      # Leave STORAGE_TYPE unset (or local) only for quick tests — /tmp uploads are lost on restart.
      - key: STORAGE_TYPE
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_PATH_STYLE
        sync: false
      - key: S3_PUBLIC_READ
        sync: false
      - key: S3_CREATE_BUCKET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_PATH
        value: /tmp/lokal-uploads
