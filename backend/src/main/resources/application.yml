spring:
  application:
    name: lokal-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

lokal:
  jwt:
    secret: ${JWT_SECRET:lokal-dev-secret-change-me-in-production-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    # local = filesystem (dev default); s3 = MinIO / Cloudflare R2 / AWS S3
    type: ${STORAGE_TYPE:local}
    local-path: ${UPLOAD_PATH:./uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:eu-central-1}
      bucket: ${S3_BUCKET:lokal}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # Public URL prefix returned to clients (no trailing slash), e.g.
      # MinIO:  http://localhost:9000/lokal
      # R2:     https://pub-xxxx.r2.dev
      # S3:     https://lokal.s3.eu-central-1.amazonaws.com
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      # Empty = auto (true when endpoint is set). Set true/false to override.
      path-style-access: ${S3_PATH_STYLE:}
      public-read: ${S3_PUBLIC_READ:true}
      create-bucket: ${S3_CREATE_BUCKET:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:lokal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Neon: use the JDBC URL and append ?sslmode=require (or &sslmode=require)
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lokal}
    username: ${DATABASE_USER:lokal}
    password: ${DATABASE_PASSWORD:lokal}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
